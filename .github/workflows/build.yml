name: Build & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-pack:
    name: Build & Package Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Check build integrity
        run: npm run check

      - name: Prepare distribution directory
        run: mkdir -p dist

      - name: Create npm tarball (.tgz)
        run: npm pack --pack-destination dist/

      - name: Create zip archive (.zip)
        run: |
          zip -r dist/dsh-model-assistant.zip \
            index.js \
            client.js \
            cordis.patch.yml \
            icon.svg \
            locale \
            package.json \
            README.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-model-assistant-dist
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
